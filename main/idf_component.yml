## IDF Component Manager Manifest File
dependencies:
  # C6 WiFi via ESP-Hosted (SDIO). Pinned to the newest esp_hosted line (2.12.x).
  # The host is backward-compatible with older ESP32-C6 slaves but not forward-
  # compatible: a 2.12 host tolerates a 2.7.x slave with only a cosmetic version-
  # mismatch warning, while an older host crashes against a newer slave
  # (sdio_rx_get_buffer assert in sdio_drv.c). Field devices whose C6 slave is
  # stuck on 2.7.x still work against a 2.12 host. Do not downgrade this pin.
  espressif/esp_hosted: ">=2.12.3,<2.12.4"
  espressif/esp_wifi_remote: "~0.16.3"
  espressif/esp_websocket_client: "~1.6.1"
  espressif/esp_lvgl_port:
    version: "^2"
    public: true
  lvgl/lvgl:
    version: "~9.5.0"
    public: true
  # Local BSP override (adapted Waveshare XC round-panel BSP).
  esp32_p4_wifi6_touch_lcd_xc:
    version: "*"
    override_path: "../components/esp32_p4_wifi6_touch_lcd_xc"
