<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AllSky Display</title>
<style>
:root{
  --bg:#0a0c14; --bg-2:#0f1320;
  --surface:rgba(22,25,34,.82); --elev:rgba(30,34,46,.88);
  --hover:rgba(30,34,48,.70); --input:rgba(12,14,20,.90);
  --border:rgba(255,255,255,.08); --border-em:rgba(255,255,255,.15);
  --glass-edge:rgba(255,255,255,.10);
  --text:#e2e8f0; --muted:#94a3b8; --text-3:#7a8ba4;
  --accent:#7aa2f7; --accent-s:#7aa2f7; --accent-sh:#9dbcff;
  --danger:#f87171; --danger-h:#ef4444; --success:#4ade80; --warning:#fbbf24; --info:#60a5fa;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
  --shadow-md:0 4px 12px rgba(0,0,0,.4); --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  --glass-shadow:inset 0 1px 0 0 rgba(255,255,255,.06),0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;scrollbar-width:thin}
html,body{margin:0;color:var(--text);min-height:100vh;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:linear-gradient(135deg,var(--bg) 0%,var(--bg-2) 100%);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%}
body::before{left:-10%;top:-15%;width:85%;height:85%;
  background:radial-gradient(circle,rgba(30,41,59,.55) 0%,rgba(30,41,59,.18) 45%,transparent 75%)}
body::after{left:52%;top:42%;width:95%;height:95%;
  background:radial-gradient(circle,rgba(15,23,42,.5) 0%,rgba(15,23,42,.16) 45%,transparent 75%)}
body{display:flex;flex-direction:column}
header,nav,main,footer{position:relative;z-index:1}
a{color:var(--accent);text-decoration:none}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1)}
header .title{font-weight:600;font-size:15px}
header .sp{flex:1}
.badge{font-size:11px;padding:3px 8px;border-radius:12px;background:var(--elev);border:1px solid var(--border)}
.badge.ok{color:var(--success)}.badge.bad{color:var(--danger)}.badge.warn{color:var(--warning)}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap;flex-shrink:0;
  background:var(--elev);color:var(--text);border:1px solid var(--border-em);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--hover);border-color:var(--glass-edge)}
.btn.ghost{background:var(--elev);color:var(--text);border:1px solid var(--border-em)}
.btn.ghost:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#0a0c14;border-color:transparent}
.btn.primary:hover{background:var(--accent-sh);border-color:transparent}
.btn.red{background:transparent;color:var(--danger);border:1px solid rgba(248,113,113,.5)}
.btn.red:hover{background:rgba(248,113,113,.12);border-color:var(--danger)}
.btn:disabled,.btn.primary:disabled{background:var(--hover);color:var(--text-3);border-color:var(--border);cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{position:sticky;top:0;z-index:20;display:flex;gap:2px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1)}
nav a{padding:7px 12px;border-radius:var(--radius-sm);font-size:13px;color:var(--muted)}
nav a:hover{background:var(--hover);color:var(--text)}nav a.active{background:rgba(122,162,247,.14);color:var(--accent)}
main{flex:1;padding:18px;max-width:1100px;width:100%;margin:0 auto}
footer{padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--muted);text-align:center;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1)}
.card{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius-lg);padding:16px;margin:0 0 14px;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1);box-shadow:var(--glass-shadow)}
.card h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.console-grid{grid-template-columns:200px 1fr}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius-lg);padding:14px;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1);box-shadow:var(--glass-shadow)}
.tile .k{font-size:11px;color:var(--muted)}.tile .v{font-size:20px;font-weight:600;margin-top:4px}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)}
.kv .k{color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--border-em);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px}
option{background:#14171f;color:var(--text)}
input[type=checkbox]{width:auto}
input[type=range]{padding:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.src{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;margin:6px 0;background:var(--elev);
  backdrop-filter:blur(8px) saturate(1);-webkit-backdrop-filter:blur(8px) saturate(1)}
.src.active{border-left:3px solid var(--success);background:rgba(74,222,128,.05)}
.dim{color:var(--text-3);opacity:1}
.toast-wrap{position:fixed;top:14px;right:14px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{min-width:280px;max-width:460px;padding:11px 14px;border-radius:var(--radius-md);background:var(--elev);border-left:4px solid var(--accent);box-shadow:var(--glass-shadow);font-size:13px;display:flex;justify-content:space-between;gap:10px;transition:opacity .3s;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1)}
.toast.success{border-color:var(--success)}.toast.error{border-color:var(--danger)}.toast.warning{border-color:var(--warning)}
.toast .x{cursor:pointer;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spin{width:38px;height:38px;border:4px solid var(--border-em);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:95;display:none;align-items:center;justify-content:center}
.modal .box{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--radius-lg);padding:20px;max-width:420px;width:90%;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1);box-shadow:var(--glass-shadow)}
.modal .box h3{margin:0 0 8px;font-size:15px}.modal .box p{color:var(--muted);font-size:13px}
.modal .box .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--elev);color:var(--muted)}
.flash-ok{border-color:var(--success)!important;box-shadow:0 0 0 2px rgba(74,222,128,.3)}
.flash-err{border-color:var(--danger)!important;box-shadow:0 0 0 2px rgba(248,113,113,.3)}
.collapse .body{display:none}.collapse.open .body{display:block}
.collapse h2{cursor:pointer}
#console{background:#05070c;border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;overflow:auto;height:60vh;min-height:250px}
.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--glass-edge);padding:12px 18px;display:flex;gap:10px;align-items:center;margin:14px -18px -18px;justify-content:flex-end;
  backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1);box-shadow:0 -8px 24px rgba(0,0,0,.3)}
.health .st{font-size:11px;font-weight:600}
.health .st.ok{color:var(--success)}.health .st.warn{color:var(--warning)}.health .st.bad{color:var(--danger)}
.health .rec{font-size:12px;color:var(--text-3);margin-top:4px}
@media(max-width:640px){nav{gap:0}.console-grid{grid-template-columns:1fr}}
.api .ep{border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;margin:8px 0;background:var(--elev)}
.api .ep .path{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;word-break:break-all}
.api .desc{color:var(--muted);font-size:13px;margin:4px 0}
.api pre{background:#05070c;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px;margin:6px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-word;overflow:auto;color:var(--text)}
.api .m{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-right:6px;vertical-align:1px}
.api .m.get{background:rgba(74,222,128,.15);color:var(--success)}
.api .m.post{background:rgba(122,162,247,.15);color:var(--accent)}
.api .m.ws{background:rgba(251,191,36,.15);color:var(--warning)}
</style>
</head>
<body>
<header>
  <span class="title" id="devname">AllSky Display</span>
  <a href="https://github.com/chvvkumar/ESP32-P4-Allsky-Display" target="_blank" rel="noopener">GitHub</a>
  <span class="sp"></span>
  <span class="badge" id="bw">WiFi</span>
  <span class="badge" id="bm">MQTT</span>
  <span class="badge" id="bs">System</span>
  <button class="btn ghost" id="nextBtn" style="display:none" onclick="doNext()">Next</button>
  <button class="btn ghost" onclick="doForceRefresh()">Force Refresh</button>
  <button class="btn" onclick="doRestart()">Restart</button>
  <button class="btn red" onclick="doFactory()">Reset</button>
  <button class="btn ghost" id="logoutBtn" style="display:none" onclick="doLogout()">Logout</button>
</header>
<nav id="nav"></nav>
<main id="main"><div class="card">Loading...</div></main>
<footer id="footer"></footer>
<div class="toast-wrap" id="toasts"></div>
<div class="overlay" id="overlay"><div class="spin"></div><div id="overlayMsg">Working...</div></div>
<div class="modal" id="modal"><div class="box"><h3 id="mTitle"></h3><p id="mBody"></p><div class="act" id="mAct"></div></div></div>

<script>
/* ---------- utilities ---------- */
var NAV=[["Dashboard","/"],["Images","/config/images"],["Display","/config/display"],
["Network","/config/network"],["MQTT","/config/mqtt"],["Console","/console"],
["System","/config/system"],["Commands","/config/commands"],["API","/api-reference"]];
function esc(s){return (s==null?'':''+s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(id){return document.getElementById(id);}
function toast(msg,type){var w=el('toasts');var t=document.createElement('div');t.className='toast '+(type||'info');
 t.innerHTML='<span>'+esc(msg)+'</span><span class="x">&times;</span>';w.appendChild(t);
 t.querySelector('.x').onclick=function(){t.remove();};
 setTimeout(function(){t.style.opacity='0';},2700);setTimeout(function(){t.remove();},3000);}
function overlay(show,msg){el('overlayMsg').textContent=msg||'Working...';el('overlay').style.display=show?'flex':'none';}
function modal(title,body,onOk,onCancel,confirm){el('mTitle').textContent=title;el('mBody').textContent=body;
 var a=el('mAct');a.innerHTML='';el('modal').style.display='flex';
 function close(){el('modal').style.display='none';}
 if(confirm){var c=document.createElement('button');c.className='btn ghost';c.textContent='Cancel';
  c.onclick=function(){close();if(onCancel)onCancel();};a.appendChild(c);}
 var ok=document.createElement('button');ok.className='btn';ok.textContent=confirm?'Confirm':'OK';
 ok.onclick=function(){close();if(onOk)onOk();};a.appendChild(ok);}
function flash(input,ok){input.classList.add(ok?'flash-ok':'flash-err');setTimeout(function(){input.classList.remove('flash-ok','flash-err');},2000);}
function api(path,opts){return fetch(path,opts).then(function(r){return r.json().then(function(j){return{ok:r.ok,status:r.status,json:j};}).catch(function(){return{ok:r.ok,status:r.status,json:{}};});});}
function form(obj){return Object.keys(obj).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(obj[k]);}).join('&');}
function postSave(fields){return api('/api/save',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form(fields)});}
function validUrl(u){return /^https?:\/\/.+/i.test(u);}

/* ---------- header actions ---------- */
function doNext(){api('/api/next-image',{method:'POST'}).then(function(r){if(!r.ok){toast('Failed to queue next image','error');return;}toast('Next image queued','success');setTimeout(function(){var p=location.pathname;if(p==='/'||p==='/config/images')route(p);},1000);});}
function doForceRefresh(){api('/api/force-refresh',{method:'POST'}).then(function(r){toast(r.ok?'Refresh forced':(r.json.message||'Force refresh failed'),r.ok?'success':'error');});}
function doLogout(){api('/api/logout',{method:'POST'}).then(function(){location.href='/login';});}
function doRestart(){modal('Restart','Are you sure you want to restart the device?',function(){
 overlay(true,'Restarting device...');api('/api/restart',{method:'POST'});toast('Device is restarting...','info');
 setTimeout(function(){location.reload();},10000);},null,true);}
function doFactory(){modal('Factory Reset','Reset all settings to defaults?',function(){
 modal('Confirm','This will erase ALL your settings. Are you absolutely sure?',function(){
  overlay(true,'Factory reset...');api('/api/factory-reset',{method:'POST'});toast('Factory reset complete. Restarting...','warning');
  setTimeout(function(){location.reload();},5000);},null,true);},null,true);}

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown',function(e){
 if(!(e.ctrlKey||e.metaKey))return;
 var k=e.key.toLowerCase();
 if(k==='s'){e.preventDefault();var f=el('main').querySelector('form');if(f){toast('Saving...','info');f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true}));}}
 else if(k==='r'){e.preventDefault();if(confirm('Restart device?'))doRestart();}
 else if(k==='n'){e.preventDefault();var b=el('nextBtn');if(b&&b.style.display!=='none')b.click();}
});

/* ---------- router ---------- */
function renderNav(path){el('nav').innerHTML=NAV.map(function(n){
 return '<a href="'+n[1]+'" class="'+(n[1]===path?'active':'')+'" onclick="return go(\''+n[1]+'\')">'+n[0]+'</a>';}).join('');}
function go(path){history.pushState({},'',path);route(path);return false;}
window.onpopstate=function(){route(location.pathname);};
var PAGES={};
function route(path){window.onbeforeunload=null;dirty=false;renderNav(path);var fn=PAGES[path]||PAGES['/'];el('main').innerHTML='<div class="card">Loading...</div>';fn();}

/* ---------- shared header/footer refresh ---------- */
function updateBadges(info){
 var net=info.network||{},mq=info.mqtt||{},sys=info.system||{};
 el('bw').className='badge '+(net.connected?'ok':'bad');el('bw').textContent='WiFi '+(net.connected?'OK':'Off');
 el('bm').className='badge '+(mq.connected?'ok':'bad');el('bm').textContent='MQTT '+(mq.connected?'OK':'Off');
 el('bs').className='badge '+(sys.healthy?'ok':'warn');el('bs').textContent=sys.healthy?'Healthy':'Warning';
 if(sys.device_name){el('devname').textContent=sys.device_name;document.title=sys.device_name;}
 var fw=info.firmware||{};
 el('footer').innerHTML=esc((sys.device_name||'AllSky')+' Configuration Portal')+' &middot; fw '+esc((fw.checksum||'').slice(0,8))+
  ' &middot; '+((fw.size/1024)|0)+' KB &middot; free '+((fw.free_space/1024)|0)+' KB &middot; SDK '+esc(sys.sdk_version||'');
}
function loadInfo(){return api('/api/info').then(function(r){return r.json;});}

/* ======================================================= DASHBOARD */
PAGES['/']=function(){
 loadInfo().then(function(i){
  var net=i.network||{},mq=i.mqtt||{},sys=i.system||{},dsp=i.display||{},img=i.image||{},fw=i.firmware||{},ha=i.home_assistant||{};
  updateBadges(i);
  el('nextBtn').style.display=(img.source_count>1)?'':'none';
  var up=sys.uptime_seconds||0;var us=up<60?up+'s':up<3600?((up/60|0)+'m '+(up%60)+'s'):up<86400?((up/3600|0)+'h '+((up%3600)/60|0)+'m'):((up/86400|0)+'d '+((up%86400)/3600|0)+'h');
  var bmode=dsp.use_ha_rest_control?'Home Assistant':dsp.brightness_auto_mode?'MQTT Auto':'Manual';
  var srcs=(img.sources||[]);
  var h='<div class="tiles">'+
   tile('Uptime',us)+tile('Active Source',((img.current_index||0)+1)+'/'+(img.source_count||1))+
   tile('Update Mode',img.cycling_enabled?'Auto':'API')+tile('Refresh Interval',Math.round((img.update_interval||0)/60000)+' min')+'</div>';
  h+='<div class="grid">';
  h+=card('Network',net.connected?kv('SSID',net.ssid)+kv('IP',net.ip)+kv('Signal',net.rssi+' dBm')+kv('MAC',net.mac)+kv('Gateway',net.gateway)+kv('DNS',net.dns):'<p class="dim">Not connected</p>');
  h+=card('MQTT',mq.connected?kv('Broker',mq.server+':'+mq.port)+kv('Client',mq.client_id)+kv('HA Discovery',ha.discovery_enabled?'On':'Off'):'<p class="dim">Not connected</p>');
  h+=card('System',kv('Chip',sys.chip_model+' rev'+sys.chip_revision)+kv('Cores/MHz',sys.chip_cores+' / '+sys.cpu_freq)+kv('Heap',fmtk(sys.free_heap)+' / '+fmtk(sys.total_heap))+kv('PSRAM',fmtk(sys.free_psram)+' / '+fmtk(sys.total_psram))+kv('Temp',(sys.temperature_celsius||0).toFixed(1)+'C / '+(sys.temperature_fahrenheit||0).toFixed(1)+'F')+kv('Health',sys.healthy?'Healthy':'Issues'));
  h+=card('Display',kv('Resolution',dsp.width+' x '+dsp.height)+kv('Brightness',dsp.brightness+'% ('+bmode+')')+kv('PWM Freq',dsp.backlight_freq+' Hz')+kv('PWM Res',dsp.backlight_resolution+' bit'));
  h+=card('Firmware',kv('Version',fw.version)+kv('Size',fmtk(fw.size))+kv('Free',fmtk(fw.free_space))+kv('Checksum','<span class="mono">'+esc((fw.checksum||'').slice(0,16))+'</span>'));
  h+=card('Home Assistant',kv('Discovery',ha.discovery_enabled?'On':'Off')+kv('Device',ha.device_name)+kv('Prefix',ha.discovery_prefix)+kv('State topic',ha.state_topic)+kv('Interval',ha.sensor_update_interval+' s'));
  h+='<div class="card health" id="healthCard"><h2>System Health</h2><p class="dim">Loading health...</p></div>';
  h+='</div>';
  h+='<div class="card"><h2>Configured Sources</h2>'+srcs.map(function(s){
    return '<div class="src '+(s.active?'active':'')+'"><span class="mono" style="word-break:break-all">'+(s.index+1)+'. '+esc(s.url)+'</span>'+(s.active?' <span class="pill">Active</span>':'')+'</div>';}).join('')+'</div>';
  el('main').innerHTML=h;
  renderHealth();
 });
 clearInterval(window._dashT);window._dashT=setInterval(function(){if(location.pathname!=='/'){clearInterval(window._dashT);return;}loadInfo().then(updateBadges);renderHealth();},5000);
};
function healthCls(s){return s==='WARNING'?'warn':(s==='CRITICAL'||s==='FAILING')?'bad':'ok';}
function renderHealth(){api('/api/health').then(function(r){var hd=r.json;var c=el('healthCard');if(!c||!hd||!hd.overall)return;
 var subs=[['System','system'],['Memory','memory'],['Network','network'],['MQTT','mqtt'],['Display','display']];
 var h='<h2>System Health</h2>';
 h+='<div class="kv"><span class="k">Overall</span><span class="st '+healthCls(hd.overall.status)+'">'+esc(hd.overall.status)+'</span></div>';
 if(hd.overall.message)h+='<p class="dim" style="font-size:12px;margin:4px 0 8px">'+esc(hd.overall.message)+'</p>';
 subs.forEach(function(p){var o=hd[p[1]];if(!o)return;h+='<div class="kv"><span class="k">'+p[0]+'</span><span class="st '+healthCls(o.status)+'" title="'+esc(o.message||'')+'">'+esc(o.status)+'</span></div>';});
 var recs=hd.recommendations||[];
 if(recs.length){h+='<div style="margin-top:8px"><span class="k" style="font-size:11px;color:var(--muted)">Recommendations</span>'+recs.map(function(t){return '<div class="rec">- '+esc(t)+'</div>';}).join('')+'</div>';}
 c.innerHTML=h;}).catch(function(){});}
function tile(k,v){return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';}
function card(t,b){return '<div class="card"><h2>'+esc(t)+'</h2>'+b+'</div>';}
function kv(k,v){return '<div class="kv"><span class="k">'+esc(k)+'</span><span>'+(v==null?'-':v)+'</span></div>';}
function fmtk(b){return b>1048576?((b/1048576).toFixed(1)+' MB'):((b/1024|0)+' KB');}

/* ======================================================= DISPLAY */
PAGES['/config/display']=function(){
 loadInfo().then(function(i){
  var d=i.display||{},def=i.defaults||{},t=i.time||{};
  function auto(field,val,extra){var f={};f[field]=val;f[field+'_present']='1';for(var k in (extra||{}))f[k]=extra[k];
   postSave(f).then(function(r){toast(r.json.status==='success'?'Settings saved':'Error: '+(r.json.message||''),r.json.status==='success'?'success':'error');});}

function tfFields(pfx,tf,maxs){return '<div class="grid"><div><label>Scale X</label><input type="number" step="0.01" min="0.1" max="'+maxs+'" id="'+pfx+'sx" value="'+tf.scaleX+'"></div>'+
 '<div><label>Scale Y</label><input type="number" step="0.01" min="0.1" max="'+maxs+'" id="'+pfx+'sy" value="'+tf.scaleY+'"></div>'+
 '<div><label>Offset X</label><input type="number" step="1" id="'+pfx+'ox" value="'+tf.offsetX+'"></div>'+
 '<div><label>Offset Y</label><input type="number" step="1" id="'+pfx+'oy" value="'+tf.offsetY+'"></div>'+
 '<div><label>Rotation</label><select id="'+pfx+'rot"><option '+(tf.rotation==0?'selected':'')+'>0</option><option '+(tf.rotation==90?'selected':'')+'>90</option><option '+(tf.rotation==180?'selected':'')+'>180</option><option '+(tf.rotation==270?'selected':'')+'>270</option></select></div></div>';}
function drawerBody(s,tuning){
 if(s.isMoon)return moonDrawer(s,tuning);
 var dis=tuning?'':'disabled';
 var h='<p class="dim">'+(tuning?'Image adjustments':'Tune on device to adjust these settings.')+'</p>';
 h+=tfFieldsRow(s,dis);
 h+='<div class="row" style="margin-top:8px">'+(tuning?'<button class="btn" onclick="tuneStop()">Done</button>':'<button class="btn" onclick="tuneStart('+s.index+')">Edit</button>')+
  '<button class="btn ghost" onclick="copyDef('+s.index+')" '+dis+'>Reset to defaults</button></div>';
 return h;
}
function tfFieldsRow(s,dis){return '<div class="grid"><div><label>Scale X</label><input type="number" step="0.01" min="0.1" max="'+IST.maxScale+'" '+dis+' value="'+s.scaleX+'" onchange="tf('+s.index+',\'scaleX\',this.value)"></div>'+
 '<div><label>Scale Y</label><input type="number" step="0.01" min="0.1" max="'+IST.maxScale+'" '+dis+' value="'+s.scaleY+'" onchange="tf('+s.index+',\'scaleY\',this.value)"></div>'+
 '<div><label>Offset X</label><input type="number" step="1" '+dis+' value="'+s.offsetX+'" onchange="tf('+s.index+',\'offsetX\',this.value)"></div>'+
 '<div><label>Offset Y</label><input type="number" step="1" '+dis+' value="'+s.offsetY+'" onchange="tf('+s.index+',\'offsetY\',this.value)"></div>'+
 '<div><label>Rotation</label><select '+dis+' onchange="tf('+s.index+',\'rotation\',this.value)"><option '+(s.rotation==0?'selected':'')+'>0</option><option '+(s.rotation==90?'selected':'')+'>90</option><option '+(s.rotation==180?'selected':'')+'>180</option><option '+(s.rotation==270?'selected':'')+'>270</option></select></div></div>';}
function moonDrawer(s,tuning){var m=IST.moon;var dis=tuning?'':'disabled';
 var h='<p class="dim">Moon settings &mdash; changes preview live while editing</p>';
 h+='<div class="grid"><div><label>Background</label><select id="mbg" '+dis+'><option value="0" '+(m.bg==0?'selected':'')+'>Black</option><option value="1" '+(m.bg==1?'selected':'')+'>Starfield</option><option value="2" '+(m.bg==2?'selected':'')+'>Glow</option><option value="3" '+(m.bg==3?'selected':'')+'>Stars + Glow</option></select></div>'+
  '<div><label>North up</label><select id="mnu" '+dis+'><option value="1" '+(m.northup==1?'selected':'')+'>On</option><option value="0" '+(m.northup==0?'selected':'')+'>Off</option></select></div>'+
  '<div><label>Disk scale</label><input type="number" step="0.01" min="0.1" max="'+IST.maxScale+'" '+dis+' value="'+s.scaleX+'" onchange="tf('+s.index+',\'scaleX\',this.value);tf('+s.index+',\'scaleY\',this.value)"></div>'+
  '<div><label>Offset X</label><input type="number" '+dis+' value="'+s.offsetX+'" onchange="tf('+s.index+',\'offsetX\',this.value)"></div>'+
  '<div><label>Offset Y</label><input type="number" '+dis+' value="'+s.offsetY+'" onchange="tf('+s.index+',\'offsetY\',this.value)"></div>'+
  '<div><label>Latitude</label><input type="number" step="0.0001" id="mlat" '+dis+' value="'+m.lat+'"></div>'+
  '<div><label>Longitude</label><input type="number" step="0.0001" id="mlon" '+dis+' value="'+m.lon+'"></div>'+
  '<div><label>Flip horizontal</label><select id="mfu" '+dis+'><option value="0" '+(m.flipu==0?'selected':'')+'>Off</option><option value="1" '+(m.flipu==1?'selected':'')+'>On</option></select></div>'+
  '<div><label>Flip vertical</label><select id="mfv" '+dis+'><option value="0" '+(m.flipv==0?'selected':'')+'>Off</option><option value="1" '+(m.flipv==1?'selected':'')+'>On</option></select></div>'+
  '<div><label>Roll offset</label><input type="number" step="1" id="mroll" '+dis+' value="'+m.roll+'"></div>'+
  '<div><label>Yaw offset</label><input type="number" step="1" id="myaw" '+dis+' value="'+m.yaw+'"></div>'+
  '<div><label>Pitch offset</label><input type="number" step="1" id="mpitch" '+dis+' value="'+m.pitch+'"></div>'+
  '<div><label>Drag light</label><select id="mlight" '+dis+'><option value="0" '+(m.light==0?'selected':'')+'>True phase</option><option value="1" '+(m.light==1?'selected':'')+'>Explore</option></select></div>'+
  '<div><label>Spin mode</label><select id="mspin" '+dis+'><option value="0" '+(m.spin==0?'selected':'')+'>Snap back</option><option value="1" '+(m.spin==1?'selected':'')+'>Free spin</option></select></div>'+
  '<div><label>Free-spin return (s)</label><input type="number" id="mspinret" '+dis+' value="'+m.spinret+'"></div></div>';
 h+='<div class="row" style="margin-top:8px">'+(tuning?'<button class="btn" onclick="tuneStop()">Done</button>':'<button class="btn" onclick="tuneStart('+s.index+')">Edit</button>')+
  '<button class="btn ghost" onclick="copyDef('+s.index+')" '+dis+'>Reset adjustments</button></div>';
 if(tuning)setTimeout(bindMoon,0);

}
function bindMoon(){['mbg','mnu','mlat','mlon','mfu','mfv','mroll','myaw','mpitch','mlight','mspin','mspinret'].forEach(function(id){var e=el(id);if(e)e.onchange=saveMoon;});}
var moonT=null;
function saveMoon(){clearTimeout(moonT);moonT=setTimeout(function(){
 var b={bg:el('mbg').value,northup:el('mnu').value,lat:el('mlat').value,lon:el('mlon').value,flipu:el('mfu').value,flipv:el('mfv').value,roll:el('mroll').value,yaw:el('myaw').value,pitch:el('mpitch').value,light:el('mlight').value,spin:el('mspin').value,spinret:el('mspinret').value};
 api('/api/setMoon',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form(b)}).then(function(r){if(r.json.status!=='success')toast(r.json.message||'Error','error');});},400);}
function tfSummary(s){var d=IST.defaults;
 if(Math.abs(s.scaleX-d.scaleX)<1e-4&&Math.abs(s.scaleY-d.scaleY)<1e-4&&s.offsetX===d.offsetX&&s.offsetY===d.offsetY&&s.rotation===d.rotation)return 'default';
 if(s.isMoon)return 'disk '+s.scaleX.toFixed(2)+'x'+(s.offsetX||s.offsetY?'  +'+s.offsetX+','+s.offsetY:'');
 return s.scaleX.toFixed(2)+'x'+s.scaleY.toFixed(2)+'  '+(s.offsetX>=0?'+':'')+s.offsetX+','+(s.offsetY>=0?'+':'')+s.offsetY+'  '+s.rotation+'deg';}
/* image actions */
function addUrl(){var u=el('newurl').value;if(!validUrl(u)){flash(el('newurl'),false);toast('URL must start with http:// or https://','error');return;}
 api('/api/add-source',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'url='+encodeURIComponent(u)}).then(function(r){if(r.ok){toast('Source added','success');loadImages();}else toast(r.json.message||'Error','error');});}
function addPreset(id){api('/api/addPreset',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'id='+encodeURIComponent(id)}).then(function(r){if(r.ok){toast(r.json.message||'Added','success');loadImages();}else toast(r.json.message||'Error','error');});}
function toggleEn(i){api('/api/toggle-image-enabled',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'index='+i}).then(function(r){toast(r.json.enabled?'Image enabled':'Image disabled','success');loadImages();});}
function updUrl(i,inp){if(!validUrl(inp.value)){flash(inp,false);toast('URL must start with http:// or https://','error');return;}
 api('/api/update-source',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'index='+i+'&url='+encodeURIComponent(inp.value)}).then(function(r){if(r.ok){flash(inp,true);IST.sources[i].url=inp.value;}else{flash(inp,false);toast(r.json.message||'Error','error');loadImages();}});}
function updDur(i,inp){var v=parseInt(inp.value);if(v<5||v>3600||isNaN(v)){flash(inp,false);toast('Duration must be 5-3600 seconds','error');return;}
 api('/api/update-image-duration',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'index='+i+'&duration='+v}).then(function(r){if(r.ok){flash(inp,true);IST.sources[i].duration=v;}else{flash(inp,false);toast(r.json.message||'Error','error');}});}
function tglDrawer(i){drawer[i]=!drawer[i];renderImages();}
function tuneStart(i){api('/api/images/tune',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'index='+i}).then(function(){toast('Holding #'+(i+1)+' on display','info');drawer[i]=true;loadImages();});}
function tuneStop(){api('/api/images/tune/stop',{method:'POST'}).then(function(){toast('Resumed cycling','info');loadImages();});}
var tfT={};
function tf(i,prop,val){clearTimeout(tfT[i+prop]);tfT[i+prop]=setTimeout(function(){
 api('/api/update-transform',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'index='+i+'&property='+prop+'&value='+val}).then(function(r){if(r.json.status==='success'){IST.sources[i][prop]=(prop.indexOf('offset')<0&&prop!=='rotation')?parseFloat(val):parseInt(val);}else toast(r.json.message||'Error','error');});},300);}
function copyDef(i){api('/api/copy-defaults',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'index='+i}).then(function(){toast('Reset to defaults','success');loadImages();});}
function selAll(c){document.querySelectorAll('.rowsel').forEach(function(x){x.checked=c;});updateSelCount();}
function updateSelCount(){var n=document.querySelectorAll('.rowsel:checked').length;var b=el('delsel');if(b){b.textContent='Delete selected ('+n+')';b.disabled=n===0;}}
function bulkDel(){var idx=[].slice.call(document.querySelectorAll('.rowsel:checked')).map(function(x){return parseInt(x.dataset.i);});
 if(!idx.length){toast('Nothing selected','warning');return;}if(idx.length>=IST.sources.length){toast('Cannot delete all sources. At least one must remain.','error');return;}
 modal('Delete sources','Delete '+idx.length+' selected source(s)?',function(){
  api('/api/bulk-delete-sources',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'indices='+encodeURIComponent(JSON.stringify(idx))}).then(function(r){if(r.ok){toast(r.json.message||'Deleted','success');drawer={};loadImages();}else toast(r.json.message||'Error','error');});},null,true);}
function mkDirty(){dirty=true;el('savedef').disabled=false;el('dirtytag').style.display='';}
function attachDefListeners(){window.onbeforeunload=function(){if(dirty)return 'Unsaved changes';};}
function saveDefaults(){postSave({image_update_mode:el('pmode').value,update_interval:el('pint').value,default_image_duration:el('pdur').value,
 random_order:el('prand').checked?'on':'',random_order_present:'1',default_scale_x:el('dsx').value,default_scale_y:el('dsy').value,
 default_offset_x:el('dox').value,default_offset_y:el('doy').value,default_rotation:el('drot').value,cycling_enabled:el('pmode').value==='0'?'on':'',cycling_enabled_present:'1'}).then(function(r){
 if(r.json.status==='success'){dirty=false;el('savedef').disabled=true;el('dirtytag').style.display='none';toast('Settings saved','success');loadImages();}else toast(r.json.message||'Error','error');});}

 '<p class="dim">USB serial at 9600 baud. Type H or ? for help. Keys are case-insensitive.</p>'+
 tbl('Image Transforms',[['+ / -','Scale both axes by 0.1'],['W/S/A/D','Move image 10px up/down/left/right'],['Q/E','Rotate 90 CCW/CW'],['R','Reset all transforms']])+
 tbl('Display',[['L','Brightness +10%'],['K','Brightness -10%']])+

function tbl(t,rows){return '<h2 style="margin-top:14px">'+esc(t)+'</h2><table style="width:100%;border-collapse:collapse">'+rows.map(function(r){return '<tr><td class="mono" style="padding:5px;border-bottom:1px solid var(--border);width:120px">'+esc(r[0])+'</td><td style="padding:5px;border-bottom:1px solid var(--border)">'+esc(r[1])+'</td></tr>';}).join('')+'</table>';}
function apiEp(a){var m=a[0];
 var h='<div class="ep"><div class="path"><span class="m '+m.toLowerCase()+'">'+m+'</span>'+esc(a[1])+'</div>';
 if(a[2])h+='<div class="desc">'+esc(a[2])+'</div>';

PAGES['/api-reference']=function(){
 var base='http://'+location.host;
 var GET=[
  ['GET','/status','Compact runtime status snapshot (JSON).'],

route(location.pathname);
