<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - AllSky Display</title>
<style>
  :root{--bg:#0a0c14;--surface:rgba(16,18,25,.85);--input-bg:#0c0e14;--border:rgba(255,255,255,.15);
    --text:#e2e8f0;--muted:#94a3b8;--accent:#7aa2f7;--accent-h:#9dbcff;--danger:#f87171}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;
    background-image:linear-gradient(135deg,#0a0c14,#0f1320)}
  body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:0;border-radius:50%}
  body::before{left:-10%;top:-15%;width:72%;height:72%;
    background:radial-gradient(circle,rgba(30,41,59,.30) 0%,rgba(30,41,59,.10) 45%,transparent 75%)}
  body::after{left:52%;top:42%;width:80%;height:80%;
    background:radial-gradient(circle,rgba(15,23,42,.34) 0%,rgba(15,23,42,.11) 45%,transparent 75%)}
  .card{position:relative;z-index:1;background:var(--surface);border:1px solid rgba(255,255,255,.10);border-radius:12px;
    padding:28px;width:320px;backdrop-filter:blur(12px) saturate(1);-webkit-backdrop-filter:blur(12px) saturate(1);
    box-shadow:inset 0 1px 0 0 rgba(255,255,255,.06),0 8px 32px rgba(0,0,0,.4)}
  h1{font-size:18px;margin:0 0 4px}
  .sub{font-size:12px;color:var(--muted);margin:0 0 20px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  input{width:100%;box-sizing:border-box;background:var(--input-bg);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button{margin-top:14px;width:100%;background:var(--accent);color:#0a0c14;border:0;border-radius:6px;
    padding:10px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{background:var(--accent-h)}button:disabled{background:rgba(30,34,48,.70);color:#7a8ba4;cursor:not-allowed}
  .err{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="on">
    <h1>AllSky Display</h1>
    <p class="sub">Sign in to access the configuration interface.</p>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" autofocus required>
    <button id="b" type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
<script>
(function(){
  var f=document.getElementById('f'),p=document.getElementById('p'),
      b=document.getElementById('b'),e=document.getElementById('e');
  f.addEventListener('submit',function(ev){
    ev.preventDefault();e.textContent='';b.disabled=true;
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:p.value})})
      .then(function(r){
        if(r.ok){window.location='/';return;}
        e.textContent=(r.status===401)?'Incorrect password':'Sign in failed (HTTP '+r.status+')';
        b.disabled=false;p.select();
      }).catch(function(){e.textContent='Network error';b.disabled=false;});
  });
})();
</script>
</body>
</html>
